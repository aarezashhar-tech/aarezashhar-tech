<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Aarez Ashhar — AI/ML student building toward ML engineering">
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .dim  { fill: #6e7681; font-size: 15px; }
    .name { fill: #e6edf3; font-size: 52px; font-weight: 700; letter-spacing: -1px; }
    .sub  { fill: #aedc5f; font-size: 18px; }
    .cur  { fill: #aedc5f; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .fade { opacity: 0; animation: in .8s ease forwards; }
    .d1 { animation-delay: .2s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: 1s; }
    @keyframes in { to { opacity: 1; } }
  </style>
  <rect width="900" height="240" rx="14" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="899" height="239" rx="14" fill="none" stroke="#21262d"/>
  <circle cx="28" cy="28" r="5" fill="#30363d"/><circle cx="46" cy="28" r="5" fill="#30363d"/><circle cx="64" cy="28" r="5" fill="#aedc5f"/>

  <text class="mono dim fade d1" x="40" y="86">~/aarez $ whoami</text>
  <text class="mono name fade d2" x="38" y="148">Aarez Ashhar</text>
  <text class="mono sub fade d3" x="40" y="190">AI/ML student  /  future ML engineer  /  builds things that ship</text>
  <rect class="cur" x="40" y="204" width="11" height="3"/>
</svg>
